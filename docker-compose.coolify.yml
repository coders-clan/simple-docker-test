services:
  server:
    build:
      context: ./server
    expose:
      - '5000'

  client:
    build:
      context: ./client
    depends_on:
      - server
    expose:
      - '3000'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      DANGEROUSLY_DISABLE_HOST_CHECK: 'true'
      WDS_SOCKET_PORT: '0'

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full commit sha to roll back to. Empty deploys the branch head.'
        type: string
        default: ''

jobs:
  deploy:
    uses: coders-clan/coolify/.github/workflows/deploy-git.yml@v1
    with:
      commit: ${{ inputs.commit }}
    secrets: inherit

name: deploy-coolify-git

on:
  push:
    branches: main
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full commit sha to build and deploy (rollback). Empty deploys the branch head.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-coolify-git-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL || vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      APP_UUID: ${{ vars.APP_UUID }}
      REQUESTED_COMMIT: ${{ inputs.commit }}
      PUSHED_COMMIT: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Pin commit in Coolify and deploy
        run: |
          set -euo pipefail
          for name in COOLIFY_URL COOLIFY_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "missing configuration: $name" >&2
              exit 1
            fi
          done
          if [ -z "$APP_UUID" ]; then
            echo 'missing variable APP_UUID' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = push ]; then
            commit="$PUSHED_COMMIT"
          elif [ -n "$REQUESTED_COMMIT" ]; then
            commit="$REQUESTED_COMMIT"
          else
            commit=HEAD
          fi
          if ! [[ "$commit" =~ ^([0-9a-f]{40}|HEAD)$ ]]; then
            echo 'commit must be a full 40 character sha' >&2
            exit 1
          fi
          api="${COOLIFY_URL%/}/api/v1"

          call() {
            local body code
            body="$(mktemp)"
            code="$(curl --silent --show-error --max-time 60 --output "$body" --write-out '%{http_code}' \
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H 'Accept: application/json' \
              "$@")" || { rm -f "$body"; return 1; }
            if [[ "$code" != 2* ]]; then
              echo "Coolify API answered HTTP $code" >&2
              rm -f "$body"
              return 1
            fi
            cat "$body"
            rm -f "$body"
          }

          call -X PATCH "$api/applications/${APP_UUID}" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg sha "$commit" '{git_commit_sha: $sha}')" > /dev/null

          response="$(call -X POST "$api/deploy?uuid=${APP_UUID}")"
          deployment="$(jq -r '(.deployments // .)[0].deployment_uuid // empty' <<< "$response")"
          if [ -z "$deployment" ]; then
            echo 'deploy call returned no deployment_uuid' >&2
            exit 1
          fi
          echo "deployment $deployment queued at $commit"

          for attempt in $(seq 1 240); do
            sleep 10
            status="$(call "$api/deployments/${deployment}" | jq -r '.status // empty')"
            echo "attempt $attempt: $status"
            case "$status" in
              finished) exit 0 ;;
              failed | cancelled*) echo "deployment ended as $status" >&2; exit 1 ;;
            esac
          done
          echo 'deployment did not finish in 40 minutes' >&2
          exit 1
